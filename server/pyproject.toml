[project]
name = "healthcare-hybrid-rag-backend"
version = "0.1.0"
description = "Backend for Healthcare AI Hybrid Graph RAG"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy[asyncio]>=2.0.32",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "qdrant-client>=1.11.0",
    "neo4j>=5.23.0",
    "rank-bm25>=0.2.2",
    "flashrank>=0.2.9",
    "pymupdf>=1.24.9",
    "python-docx>=1.1.2",
    "openpyxl>=3.1.5",
    "python-pptx>=1.0.1",
    "httpx>=0.27.0",
    "google-genai>=0.1.0",
    "python-multipart>=0.0.9",
    "tiktoken>=0.7.0"
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.8",
    "ruff>=0.6.0",
    "aiosqlite>=0.20.0"
]

[tool.ruff]
cache-dir = ".ruff_cache"
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist"
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "ASYNC"   # flake8-async
]
ignore = [
    "E501",   # line length handled by ruff format
    "B008",   # do not perform function calls in argument defaults (FastAPI Depends)
    "ASYNC230", # blocking file open in async functions
    "ASYNC240"  # pathlib operations in async functions
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
